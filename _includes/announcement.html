{% if site.data.announcement.announcements.size > 0 %}
<style>
  #site-announcement-modal {
    position: fixed;
    z-index: 3000;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    background: rgba(20, 30, 48, 0.32);
    backdrop-filter: blur(4px);
  }

  .site-announcement-card {
    position: relative;
    width: min(100%, 32rem);
    padding: 1.8rem 2.5rem 1.7rem 1.8rem;
    border: 1px solid color-mix(in srgb, var(--link-color, #2f7dde) 20%, transparent);
    border-radius: 1rem;
    background: linear-gradient(145deg, var(--card-bg, #fff), color-mix(in srgb, var(--card-bg, #fff) 94%, #dbeafe));
    box-shadow: 0 1.4rem 3.5rem rgba(15, 23, 42, 0.2);
    color: var(--text-color, #34343c);
  }

  .site-announcement-card h2,
  #site-announcement-sidebar h2 {
    margin: 0 0 0.55rem;
    font-size: 1.15rem;
  }

  .site-announcement-card p,
  #site-announcement-sidebar p {
    margin: 0 0 1.15rem;
    line-height: 1.65;
  }

  .site-announcement-close {
    position: absolute;
    top: 0.8rem;
    right: 0.85rem;
    border: 0;
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted-color, #6c757d);
    font-size: 1.35rem;
    line-height: 1;
    cursor: pointer;
  }

  .site-announcement-close:hover {
    background: rgba(127, 127, 127, 0.12);
    color: var(--text-color, #34343c);
  }

  .site-announcement-kicker {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-bottom: 0.7rem;
    color: var(--link-color, #2f7dde);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  .site-announcement-kicker::before {
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: currentColor;
    content: "";
  }

  .site-announcement-link {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.55rem 0.8rem;
    border-radius: 0.5rem;
    background: var(--link-color, #2f7dde);
    color: #fff !important;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none !important;
  }

  .site-announcement-link::after {
    content: "→";
  }

  .site-announcement-link:hover {
    filter: brightness(0.92);
  }

  #site-announcement-sidebar {
    margin: 0 0 1.5rem;
    padding: 1rem 1rem 1.05rem;
    border: 1px solid color-mix(in srgb, var(--link-color, #2f7dde) 20%, transparent);
    border-radius: 0.65rem;
    background: color-mix(in srgb, var(--main-bg, #f7f7f7) 92%, #dbeafe);
  }

  #site-announcement-sidebar p {
    font-size: 0.92rem;
  }

  .site-announcement-tabs {
    display: flex;
    gap: 0.35rem;
    margin: 0 0 0.85rem;
    overflow-x: auto;
  }

  .site-announcement-tab {
    flex: 0 0 auto;
    max-width: 100%;
    padding: 0.3rem 0.55rem;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--text-muted-color, #6c757d);
    font-size: 0.78rem;
    line-height: 1.2;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .site-announcement-tab:hover,
  .site-announcement-tab.is-active {
    border-color: color-mix(in srgb, var(--link-color, #2f7dde) 30%, transparent);
    background: color-mix(in srgb, var(--link-color, #2f7dde) 12%, transparent);
    color: var(--link-color, #2f7dde);
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var announcements = {{ site.data.announcement.announcements | jsonify }}.filter(function (item) {
      return item.enabled !== false;
    });
    if (!announcements.length) return;

    function storageKey(item) {
      return "site-announcement-dismissed:" + item.id;
    }

    function announcementContent(announcement) {
      var wrapper = document.createElement("div");
      var kicker = document.createElement("div");
      var title = document.createElement("h2");
      var message = document.createElement("p");
      kicker.className = "site-announcement-kicker";
      kicker.textContent = "公告";
      title.textContent = announcement.title;
      message.textContent = announcement.message;
      wrapper.append(kicker, title, message);
      if (announcement.linkLabel && announcement.linkUrl) {
        var link = document.createElement("a");
        link.className = "site-announcement-link";
        link.href = announcement.linkUrl;
        link.textContent = announcement.linkLabel;
        wrapper.append(link);
      }
      return wrapper;
    }

    function showSidebar() {
      if (document.getElementById("site-announcement-sidebar")) return;
      var panel = document.getElementById("panel-wrapper");
      if (!panel) return;
      var sidebar = document.createElement("section");
      sidebar.id = "site-announcement-sidebar";
      sidebar.setAttribute("aria-label", "公告");
      var tabs = document.createElement("div");
      tabs.className = "site-announcement-tabs";
      tabs.setAttribute("role", "tablist");
      var content = document.createElement("div");
      var tabButtons = [];

      function selectAnnouncement(item, button) {
        content.replaceChildren(announcementContent(item));
        tabButtons.forEach(function (tab) {
          tab.classList.toggle("is-active", tab === button);
          tab.setAttribute("aria-selected", tab === button ? "true" : "false");
        });
      }

      announcements.forEach(function (item, index) {
        var tab = document.createElement("button");
        tab.className = "site-announcement-tab";
        tab.type = "button";
        tab.setAttribute("role", "tab");
        tab.textContent = item.title;
        tab.addEventListener("click", function () { selectAnnouncement(item, tab); });
        tabs.append(tab);
        tabButtons.push(tab);
        if (index === 0) selectAnnouncement(item, tab);
      });

      sidebar.append(tabs, content);
      panel.prepend(sidebar);
    }

    function dismiss(modal, announcement) {
      localStorage.setItem(storageKey(announcement), "true");
      modal.remove();
      showSidebar();
    }

    var nextAnnouncement = announcements.find(function (item) {
      return localStorage.getItem(storageKey(item)) !== "true";
    });

    if (!nextAnnouncement) {
      showSidebar();
      return;
    }

    var modal = document.createElement("div");
    modal.id = "site-announcement-modal";
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    modal.setAttribute("aria-label", nextAnnouncement.title);
    var card = document.createElement("div");
    card.className = "site-announcement-card";
    var close = document.createElement("button");
    close.className = "site-announcement-close";
    close.type = "button";
    close.setAttribute("aria-label", "关闭公告");
    close.textContent = "×";
    card.append(close, announcementContent(nextAnnouncement));
    modal.append(card);
    document.body.append(modal);
    close.focus();
    close.addEventListener("click", function () { dismiss(modal, nextAnnouncement); });
    modal.addEventListener("click", function (event) {
      if (event.target === modal) dismiss(modal, nextAnnouncement);
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && document.body.contains(modal)) dismiss(modal, nextAnnouncement);
    });
  });
</script>
{% endif %}
